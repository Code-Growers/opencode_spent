name: openspent_website
publish_to: none
version: 0.1.0

environment:
  sdk: "3.11.5"

dependencies:
  jaspr: 0.23.5
  jaspr_hooks: 0.2.0

dev_dependencies:
  build_runner: 2.15.0
  build_daemon: 4.1.6
  # Jaspr still uses build_modules; 4.5+ registers duplicate module builders.
  build_web_compilers: 4.4.19
  jaspr_builder: 0.23.5
  jaspr_cli: 0.23.5
  jaspr_tailwind: 0.3.6

jaspr:
  mode: static
  port: 8081
